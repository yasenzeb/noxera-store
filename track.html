<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>تتبع طلبك | NOXERA</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --bg: #F4F4F6;
      --cream: #000000;
      --rust: #79D20C;
      --rust-glow: rgba(121, 210, 12, 0.3);
      --card: #FFFFFF;
      --border: rgba(0, 0, 0, 0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: #FFFFFF;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo span { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--rust); letter-spacing: 3px; font-weight: 900; }
    .nav-links { display: flex; align-items: center; gap: 2rem; }
    .nav-links a { color: var(--cream); text-decoration: none; font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 2px; opacity: 0.7; transition: opacity 0.3s, color 0.3s; }
    .nav-links a:hover { opacity: 1; color: var(--rust); }

    .page-wrap {
      padding: 100px 1.5rem 4rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .track-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .success-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(121, 210, 12, 0.1);
      border: 2px solid var(--rust);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: var(--rust);
      margin-bottom: 1.2rem;
      box-shadow: 0 0 20px var(--rust-glow);
    }
    .success-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--cream);
      margin-bottom: 0.4rem;
    }
    .success-desc {
      font-size: 0.95rem;
      color: var(--cream);
      opacity: 0.6;
    }

    .timeline-wrap {
      margin: 3.5rem 0 3rem;
      position: relative;
    }
    .timeline-line-bg {
      position: absolute;
      top: 24px; left: 6%; right: 6%;
      height: 4px;
      background: rgba(0, 0, 0, 0.06);
      z-index: 1;
      border-radius: 2px;
    }
    .timeline-line-progress {
      position: absolute;
      top: 24px; left: 6%;
      width: 0%;
      height: 4px;
      background: var(--rust);
      z-index: 2;
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px var(--rust-glow);
    }
    .timeline-steps {
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 3;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      text-align: center;
    }
    .step-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #F3F4F6;
      border: 3px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: rgba(0, 0, 0, 0.25);
      transition: all 0.5s ease;
    }
    .step-item.active .step-icon {
      background: var(--card);
      border-color: var(--rust);
      color: var(--cream);
      box-shadow: 0 0 20px var(--rust-glow);
    }
    .step-item.completed .step-icon {
      background: var(--rust);
      border-color: var(--rust);
      color: black;
    }
    .step-label {
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 0.8rem;
      color: rgba(0, 0, 0, 0.3);
      transition: color 0.5s ease;
    }
    .step-item.active .step-label,
    .step-item.completed .step-label {
      color: var(--cream);
    }
    .step-time {
      font-size: 0.7rem;
      font-family: 'Space Mono', monospace;
      opacity: 0.5;
      margin-top: 0.2rem;
    }

    .details-section {
      border-top: 1px solid var(--border);
      padding-top: 2rem;
      margin-top: 2.5rem;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title i {
      color: var(--rust);
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }
    .detail-label {
      opacity: 0.5;
    }
    .detail-val {
      font-weight: 700;
      font-family: 'Space Mono', monospace;
    }
    .btn-continue {
      display: inline-block;
      background: #0B252E;
      color: #FFFFFF;
      padding: 14px 40px;
      border-radius: 100px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-decoration: none;
      transition: background 0.3s, transform 0.2s;
      margin-top: 2rem;
    }
    .btn-continue:hover {
      background: #111827;
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      nav { padding: 0 1rem; }
      .page-wrap { padding: 80px 1rem 3rem; }
      .track-card { padding: 2rem 1.2rem; }
      .step-icon { width: 42px; height: 42px; font-size: 1rem; }
      .step-label { font-size: 0.7rem; }
      .success-icon { width: 60px; height: 60px; font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="logo.png" alt="NOXERA" onerror="this.style.display='none'">
    <span>NOXERA</span>
  </a>
  <div class="nav-links">
    <a href="index.html">HOME</a>
    <a href="index.html#shop">SHOP</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="track-card">

    <div class="success-badge">
      <div class="success-icon"><i class="fas fa-check"></i></div>
      <div class="success-title">تم استلام طلبك بنجاح! 🎉</div>
      <div class="success-desc">رقم الطلب: <b id="orderNumber">...</b></div>
    </div>

    <div class="timeline-wrap">
      <div class="timeline-line-bg"></div>
      <div class="timeline-line-progress" id="timelineProgress"></div>
      <div class="timeline-steps" id="timelineSteps">
        <div class="step-item active" data-status="pending">
          <div class="step-icon"><i class="fas fa-clock"></i></div>
          <div class="step-label">قيد الانتظار</div>
          <div class="step-time" id="time-pending"></div>
        </div>
        <div class="step-item" data-status="confirmed">
          <div class="step-icon"><i class="fas fa-check-double"></i></div>
          <div class="step-label">تم التأكيد</div>
          <div class="step-time" id="time-confirmed"></div>
        </div>
        <div class="step-item" data-status="shipped">
          <div class="step-icon"><i class="fas fa-truck"></i></div>
          <div class="step-label">خرج للشحن</div>
          <div class="step-time" id="time-shipped"></div>
        </div>
        <div class="step-item" data-status="delivered">
          <div class="step-icon"><i class="fas fa-box-open"></i></div>
          <div class="step-label">تم التسليم</div>
          <div class="step-time" id="time-delivered"></div>
        </div>
      </div>
    </div>

    <div class="details-section" id="detailsSection" style="display:none">
      <div class="section-title"><i class="fas fa-receipt"></i> تفاصيل الطلب</div>
      <div id="detailsRows"></div>
    </div>

    <div style="text-align:center;">
      <a href="index.html" class="btn-continue">متابعة التسوق</a>
    </div>

  </div>
</div>

<script>
  const statusOrder = ['pending','confirmed','shipped','delivered'];
  const statusAr = { pending:'قيد الانتظار', confirmed:'تم التأكيد', shipped:'خرج للشحن', delivered:'تم التسليم' };

  function getQueryParam(name) {
    const url = new URLSearchParams(window.location.search);
    return url.get(name) || '';
  }

  const orderId     = getQueryParam('id');
  const orderNumber = getQueryParam('number');

  if (orderNumber) {
    document.getElementById('orderNumber').innerText = '#' + orderNumber;
  }

  function updateTimeline(status) {
    const idx = statusOrder.indexOf(status || 'pending');
    const progressPercents = [0, 29, 62, 88];
    document.getElementById('timelineProgress').style.width = progressPercents[idx] + '%';

    document.querySelectorAll('.step-item').forEach((step, i) => {
      step.classList.remove('active', 'completed');
      if (i < idx) step.classList.add('completed');
      else if (i === idx) step.classList.add('active');
    });
  }

  function renderDetails(order) {
    if (!order) return;
    const section = document.getElementById('detailsSection');
    const rows = document.getElementById('detailsRows');
    section.style.display = 'block';

    const items = [
      ['المنتج', order.product || '—'],
      ['المقاس', (order.size || '—').toUpperCase()],
      ['اللون', order.color || '—'],
      ['الكمية', order.qty || 1],
      ['العميل', order.customer_name || '—'],
      ['الموبايل', order.customer_phone || '—'],
      ['المحافظة', order.governorate || '—'],
      ['العنوان', order.address || '—'],
      ['سعر المنتج', (order.price || 0) + ' ج.م'],
      ['الشحن', (order.shipping || 0) + ' ج.م'],
      ['الإجمالي', (order.total || 0) + ' ج.م'],
      ['الدفع', order.payment_method || '—'],
    ];

    rows.innerHTML = items.map(([label, val]) => `
      <div class="detail-row">
        <span class="detail-label">${label}</span>
        <span class="detail-val">${val}</span>
      </div>
    `).join('');
  }

  async function fetchOrderStatus() {
    if (!orderId && !orderNumber) return;
    try {
      const q = orderId ? `id=${orderId}` : `number=${orderNumber}`;
      const res = await fetch(`/api/orders?${q}`);
      const data = await res.json();
      if (data.success && data.order) {
        updateTimeline(data.order.status);
        renderDetails(data.order);
      }
    } catch(e) {
      console.error('Error fetching order:', e);
    }
  }

  updateTimeline('pending');
  fetchOrderStatus();
  setInterval(fetchOrderStatus, 15000);
</script>
</body>
</html>
