<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>تتبع طلبك | NOXERA</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --bg: #1B191A;
      --cream: #E9E4E0;
      --rust: #943A1F;
      --rust-glow: rgba(148, 58, 31, 0.4);
      --card: #141213;
      --border: rgba(148, 58, 31, 0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: #141213;
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo span { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--cream); letter-spacing: 3px; }
    .nav-links { display: flex; align-items: center; gap: 2rem; }
    .nav-links a { color: var(--cream); text-decoration: none; font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 2px; opacity: 0.7; transition: opacity 0.3s, color 0.3s; }
    .nav-links a:hover { opacity: 1; color: var(--rust); }

    /* LAYOUT */
    .page-wrap {
      padding: 100px 1.5rem 4rem;
      max-width: 800px;
      margin: 0 auto;
    }

    /* CARD STYLE */
    .track-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    /* SUCCESS SECTION */
    .success-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(148, 58, 31, 0.15);
      border: 2px solid var(--rust);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: var(--cream);
      margin-bottom: 1.2rem;
      box-shadow: 0 0 20px var(--rust-glow);
    }
    .success-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--cream);
      margin-bottom: 0.4rem;
    }
    .success-desc {
      font-size: 0.95rem;
      color: var(--cream);
      opacity: 0.6;
    }

    /* AMAZON-STYLE TIMELINE */
    .timeline-wrap {
      margin: 3.5rem 0 3rem;
      position: relative;
    }
    .timeline-line-bg {
      position: absolute;
      top: 24px; left: 6%; right: 6%;
      height: 4px;
      background: rgba(233, 228, 224, 0.1);
      z-index: 1;
      border-radius: 2px;
    }
    .timeline-line-progress {
      position: absolute;
      top: 24px; left: 6%;
      width: 0%;
      height: 4px;
      background: var(--rust);
      z-index: 2;
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px var(--rust);
    }
    .timeline-steps {
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 3;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      text-align: center;
    }
    .step-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #1d1b1c;
      border: 3px solid rgba(233, 228, 224, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: rgba(233, 228, 224, 0.4);
      transition: all 0.5s ease;
    }
    .step-item.active .step-icon {
      background: var(--bg);
      border-color: var(--rust);
      color: var(--cream);
      box-shadow: 0 0 20px var(--rust-glow);
    }
    .step-item.completed .step-icon {
      background: var(--rust);
      border-color: var(--rust);
      color: var(--cream);
    }
    .step-label {
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 0.8rem;
      color: rgba(233, 228, 224, 0.4);
      transition: color 0.5s ease;
    }
    .step-item.active .step-label,
    .step-item.completed .step-label {
      color: var(--cream);
    }
    .step-time {
      font-size: 0.7rem;
      font-family: 'Space Mono', monospace;
      opacity: 0.5;
      margin-top: 0.2rem;
    }

    /* DETAILS SECTION */
    .details-section {
      border-top: 1px solid var(--border);
      padding-top: 2rem;
      margin-top: 2.5rem;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title i {
      color: var(--rust);
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(148, 58, 31, 0.08);
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      opacity: 0.5;
    }
    .detail-value {
      font-weight: 600;
    }
    
    /* PRODUCTS LIST */
    .order-items-box {
      background: rgba(148, 58, 31, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
    }
    .item-name {
      font-weight: 700;
    }
    .item-qty {
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      opacity: 0.5;
      margin-right: 0.5rem;
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 640px) {
      .track-card {
        padding: 2rem 1.2rem;
      }
      .timeline-wrap {
        display: flex;
        flex-direction: row-reverse;
        padding-right: 20px;
        margin: 2.5rem 0 2rem;
      }
      .timeline-line-bg {
        top: 0; bottom: 0; left: auto; right: 45px;
        width: 4px; height: auto;
      }
      .timeline-line-progress {
        top: 0; left: auto; right: 45px;
        width: 4px; height: 0%;
      }
      .timeline-steps {
        flex-direction: column;
        gap: 2.5rem;
        width: 100%;
        align-items: flex-start;
      }
      .step-item {
        flex-direction: row;
        text-align: right;
        gap: 1.5rem;
        width: 100%;
        justify-content: flex-start;
      }
      .step-label {
        margin-top: 0;
        text-align: right;
      }
      .step-time {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">
    <span>NOXERA</span>
  </a>
  <div class="nav-links">
    <a href="index.html">HOME</a>
    <a href="index.html#shop">SHOP</a>
  </div>
</nav>

<!-- MAIN LAYOUT -->
<div class="page-wrap">
  <div class="track-card">
    
    <!-- Success Alert Header -->
    <div class="success-badge">
      <div class="success-icon">
        <i class="fas fa-check"></i>
      </div>
      <h2 class="success-title">تم استلام طلبك بنجاح</h2>
      <p class="success-desc">شكراً لك لتسوقك من NOXERA. يمكنك متابعة حالة طلبك مباشرة من هذه الصفحة.</p>
    </div>

    <!-- Tracking Timeline (Amazon Style) -->
    <div class="timeline-wrap">
      <div class="timeline-line-bg"></div>
      <div class="timeline-line-progress" id="progressLine"></div>
      
      <div class="timeline-steps">
        <!-- Step 1: Pending -->
        <div class="step-item" id="step-pending">
          <div class="step-icon">
            <i class="fas fa-clock"></i>
          </div>
          <div>
            <div class="step-label">قيد الانتظار</div>
            <div class="step-time" id="time-pending"></div>
          </div>
        </div>
        
        <!-- Step 2: Confirmed -->
        <div class="step-item" id="step-confirmed">
          <div class="step-icon">
            <i class="fas fa-check-double"></i>
          </div>
          <div>
            <div class="step-label">مؤكد</div>
            <div class="step-time" id="time-confirmed"></div>
          </div>
        </div>
        
        <!-- Step 3: Shipped -->
        <div class="step-item" id="step-shipped">
          <div class="step-icon">
            <i class="fas fa-shipping-fast"></i>
          </div>
          <div>
            <div class="step-label">جاري الشحن</div>
            <div class="step-time" id="time-shipped"></div>
          </div>
        </div>
        
        <!-- Step 4: Delivered -->
        <div class="step-item" id="step-delivered">
          <div class="step-icon">
            <i class="fas fa-home"></i>
          </div>
          <div>
            <div class="step-label">تم التسليم</div>
            <div class="step-time" id="time-delivered"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Order Items Summary -->
    <div class="details-section">
      <h3 class="section-title">
        <i class="fas fa-shopping-bag"></i>
        تفاصيل المنتجات
      </h3>
      <div class="order-items-box" id="itemsList">
        <!-- Dynmic Items -->
      </div>
    </div>

    <!-- Customer/Shipping Info Summary -->
    <div class="details-section">
      <h3 class="section-title">
        <i class="fas fa-truck"></i>
        تفاصيل الشحن والدفع
      </h3>
      <div class="track-details">
        <div class="detail-row">
          <span class="detail-label">رقم الطلب</span>
          <span class="detail-value" id="orderNumberVal">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">الاسم الكامل</span>
          <span class="detail-value" id="custNameVal">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">الهاتف</span>
          <span class="detail-value" id="custPhoneVal">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">المحافظة</span>
          <span class="detail-value" id="custGovVal">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">العنوان التفصيلي</span>
          <span class="detail-value" id="custAddressVal">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">طريقة الدفع</span>
          <span class="detail-value" id="payMethodVal">—</span>
        </div>
        <div class="detail-row" style="border-top: 1px solid var(--border); padding-top: 1.2rem; margin-top: 0.5rem;">
          <span class="detail-label" style="font-size: 1.1rem; opacity: 0.8; font-weight: 700;">الإجمالي</span>
          <span class="detail-value" id="totalAmtVal" style="font-size: 1.2rem; color: var(--rust);">—</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  // Parse URL query params
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id') || '';
  const orderNum = params.get('number') || '';

  // DOM Elements
  const progressLine = document.getElementById('progressLine');
  const itemsList = document.getElementById('itemsList');
  const orderNumberVal = document.getElementById('orderNumberVal');
  const custNameVal = document.getElementById('custNameVal');
  const custPhoneVal = document.getElementById('custPhoneVal');
  const custGovVal = document.getElementById('custGovVal');
  const custAddressVal = document.getElementById('custAddressVal');
  const payMethodVal = document.getElementById('payMethodVal');
  const totalAmtVal = document.getElementById('totalAmtVal');

  // Status mapping to timeline completion percentages
  const statusConfig = {
    pending: { percent: 0, steps: ['pending'] },
    confirmed: { percent: 33, steps: ['pending', 'confirmed'] },
    shipped: { percent: 66, steps: ['pending', 'confirmed', 'shipped'] },
    delivered: { percent: 100, steps: ['pending', 'confirmed', 'shipped', 'delivered'] }
  };

  function updateTimeline(status, updatedAt) {
    const config = statusConfig[status] || statusConfig['pending'];
    
    // Reset steps
    document.querySelectorAll('.step-item').forEach(el => {
      el.classList.remove('active', 'completed');
    });

    // Mark steps as completed or active
    config.steps.forEach((step, idx) => {
      const el = document.getElementById(`step-${step}`);
      if (el) {
        if (idx === config.steps.length - 1) {
          el.classList.add('active');
          // Add timestamp to the currently active status
          const timeEl = document.getElementById(`time-${step}`);
          if (timeEl && updatedAt) {
            const date = new Date(updatedAt);
            timeEl.innerText = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) + ' - ' + date.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric' });
          }
        } else {
          el.classList.add('completed');
        }
      }
    });

    // Update the progress line (supporting vertical timeline layout for mobile)
    const isMobile = window.innerWidth <= 640;
    if (isMobile) {
      progressLine.style.width = '4px';
      progressLine.style.height = `${config.percent}%`;
    } else {
      progressLine.style.height = '4px';
      progressLine.style.width = `${config.percent}%`;
    }
  }

  async function fetchOrderStatus() {
    if (!orderId && !orderNum) return;
    
    try {
      const url = `/api/orders?id=${orderId}&number=${orderNum}`;
      const res = await fetch(url);
      const data = await res.json();
      
      if (data.success && data.order) {
        const order = data.order;
        
        // Update customer details
        orderNumberVal.innerText = order.order_number;
        custNameVal.innerText = order.customer_name;
        custPhoneVal.innerText = order.customer_phone;
        custGovVal.innerText = order.governorate || '—';
        custAddressVal.innerText = order.address || '—';
        payMethodVal.innerText = order.payment_method === 'cod' ? 'كاش عند الاستلام' : 'تحويل بنكي';
        totalAmtVal.innerText = `${order.total} ج.م`;

        // Update items details
        let items = order.items || [];
        if (typeof items === 'string') {
          try { items = JSON.parse(items); } catch(e) {}
        }
        if (Array.isArray(items) && items.length) {
          itemsList.innerHTML = items.map(it => `
            <div class="item-row">
              <span class="item-name">${it.name} <span class="item-qty">x ${it.quantity || 1}</span></span>
              <span class="item-price" style="font-weight:600;">${(it.price || 0) * (it.quantity || 1)} ج.م</span>
            </div>
          `).join('');
        } else {
          itemsList.innerHTML = `<div class="item-row"><span class="item-name">طلب رقم ${order.order_number}</span></div>`;
        }

        // Update tracking status timeline
        updateTimeline(order.status, order.created_at);
      }
    } catch (e) {
      console.error('Failed to query order details:', e);
    }
  }

  // Initial load
  fetchOrderStatus();

  // Poll for updates every 7 seconds
  setInterval(fetchOrderStatus, 7000);

  // Re-render timeline line on resize
  window.addEventListener('resize', () => {
    fetchOrderStatus();
  });
</script>
</body>
</html>
